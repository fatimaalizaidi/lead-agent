# Lead-agent backend only (FastAPI + local Chroma + Redis memory). n8n stays outside this stack.
#
# Prerequisites: copy `.env.example` → `.env` and set OPENAI_API_KEY (never commit `.env`).
#
#   docker compose up -d --build
#   curl -s http://localhost:8000/health
#
# Override host port: LEAD_AGENT_PORT=8080 docker compose up -d
# Tear down (keeps volumes): docker compose down
# Tear down + wipe Chroma/Redis/logs: docker compose down -v

services:
  redis:
    image: redis:7-alpine
    container_name: lead-redis
    volumes:
      - redis_data:/data
    # No host port published by default (API reaches Redis on the compose network).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  lead-analyzer:
    build: .
    container_name: lead-analyzer
    ports:
      - "${LEAD_AGENT_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      # Optional overrides (also supported via `.env` / pydantic Settings)
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RAG_K: ${RAG_K:-3}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-1.2}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      # Conversation memory — talk to the compose Redis service
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MEMORY_TTL_SECONDS: ${MEMORY_TTL_SECONDS:-604800}
      MEMORY_MAX_MESSAGES: ${MEMORY_MAX_MESSAGES:-20}
    volumes:
      # rag.py persists under /app/data/chroma (CHROMA_DIR)
      - chroma_data:/app/data/chroma
      - lead_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  chroma_data:
  lead_logs:
  redis_data:
