# Tool config only — the app is not packaged. Dependencies live in requirements*.txt.

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["data", "logs", "models", "eval/results"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates and test fixtures carry long literal strings.
"tests/*" = ["E501"]
