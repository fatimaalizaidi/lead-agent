# Render Blueprint — Web Service from this Dockerfile.
# Dashboard: New + → Blueprint → connect repo with this file at root.
# Or: New + → Web Service → Runtime Docker → Health Check Path /health
#     (leave Start Command empty — Dockerfile CMD uses $PORT).
# Set OPENAI_API_KEY in Environment (sync: false = dashboard secret only).
# n8n: POST https://YOUR-SERVICE.onrender.com/analyze-lead
services:
  - type: web
    name: lead-analyzer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
