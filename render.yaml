# Render Blueprint — Web Service from this Dockerfile.
# Dashboard: New + → Blueprint → connect repo with this file at root.
# Or: New + → Web Service → Runtime Docker → Health Check Path /health
#     (leave Start Command empty — Dockerfile CMD uses $PORT).
# Set OPENAI_API_KEY in Environment (sync: false = dashboard secret only).
# n8n: POST https://YOUR-SERVICE.onrender.com/analyze-lead
services:
  - type: web
    name: lead-analyzer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy a push to main only after GitHub Actions CI (.github/workflows/ci.yml) passes.
    autoDeployTrigger: checksPass
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # LangSmith tracing: add the key in the dashboard to switch it on (docs/tracing.md).
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: lead-agent
      # Free plan has 0.1 CPU: the local cross-encoder re-ranker makes the first request take ~2 min.
      # Hybrid search without it scored 0.91 vs 0.93 context recall (docs/rag-evaluation.md).
      - key: RAG_RERANKER
        value: none
